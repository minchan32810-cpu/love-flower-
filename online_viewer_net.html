
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 🌷</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

svg {
    width: 100%;
    max-width: 500px;
    height: 100vh;
}

.stem {
    fill: none;
    stroke: #238b45;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: grow 3s ease forwards;
}

.leaf {
    fill: #238b45;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: leafGrow 1.5s ease forwards;
    animation-delay: 2.2s;
}

.petal {
    fill: none;
    stroke: #ff75b5;
    stroke-width: 1.3;
    opacity: 0;
    animation: bloom 2s ease forwards;
    animation-delay: 3s;
}

.flowerText {
    fill: #ff91c5;
    font-size: 12px;
    font-family: Georgia, serif;
    letter-spacing: 2px;
}

@keyframes grow {
    to { stroke-dashoffset: 0; }
}

@keyframes leafGrow {
    from {
        opacity: 0;
        transform: scale(0);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes bloom {
    from {
        opacity: 0;
        transform: scale(0.05);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.message {
    position: absolute;
    bottom: 9%;
    color: #ff91c5;
    font-family: Georgia, serif;
    font-size: 22px;
    letter-spacing: 3px;
    opacity: 0;
    animation: appear 2s ease forwards;
    animation-delay: 5s;
}

@keyframes appear {
    to { opacity: 1; }
}
</style>
</head>

<body>
